<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Stundenplan Picker</title>
    <script>
        (() => {
            try {
                const savedTheme = localStorage.getItem("stundenplan-picker:theme");
                const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
                document.documentElement.dataset.theme = savedTheme === "dark" || (!savedTheme && prefersDark) ? "dark" : "light";
            } catch {
                document.documentElement.dataset.theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            }
        })();
    </script>
    <style>
        :root {
            color-scheme: light;
            --bg: #f6f7f9;
            --surface: #ffffff;
            --surface-muted: #eef2f3;
            --surface-subtle: #fbfcfc;
            --surface-translucent: rgba(255, 255, 255, 0.55);
            --ink: #17212b;
            --muted: #62707c;
            --line: #d8dee4;
            --line-strong: #b9c3cc;
            --primary: #006b5f;
            --primary-dark: #004f48;
            --primary-soft: #e1f2ef;
            --primary-action-bg: #006b5f;
            --primary-action-hover: #004f48;
            --primary-action-shadow: 0 10px 24px rgba(0, 79, 72, 0.22);
            --on-primary: #ffffff;
            --control-active-bg: #17212b;
            --control-active-ink: #ffffff;
            --event-bg: #eaf0fb;
            --event-border: #2f5ea8;
            --warning: #996200;
            --warning-soft: #fff4d8;
            --warning-hover: rgba(153, 98, 0, 0.08);
            --warning-line: rgba(153, 98, 0, 0.28);
            --warning-item-line: rgba(153, 98, 0, 0.24);
            --danger: #9c2f3b;
            --danger-soft: #ffe6e9;
            --focus: #2f5ea8;
            --focus-ring: rgba(47, 94, 168, 0.23);
            --calendar-grid-line: rgba(216, 222, 228, 0.9);
            --event-shadow: 0 8px 18px rgba(23, 33, 43, 0.08);
            --dialog-backdrop: rgba(23, 33, 43, 0.32);
            --shadow: 0 18px 45px rgba(23, 33, 43, 0.08);
            --radius: 8px;
            --font: Arial, Helvetica, sans-serif;
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #111820;
            --surface: #18212b;
            --surface-muted: #23303b;
            --surface-subtle: #141d25;
            --surface-translucent: rgba(24, 33, 43, 0.78);
            --ink: #eef4f8;
            --muted: #aab8c5;
            --line: #334452;
            --line-strong: #526574;
            --primary: #66d7ca;
            --primary-dark: #9be9df;
            --primary-soft: #123b38;
            --primary-action-bg: #08786f;
            --primary-action-hover: #09645d;
            --primary-action-shadow: 0 10px 24px rgba(0, 0, 0, 0.24);
            --on-primary: #ffffff;
            --control-active-bg: #dce9ef;
            --control-active-ink: #111820;
            --event-bg: #1f3552;
            --event-border: #7aa9eb;
            --warning: #f0c36c;
            --warning-soft: #332716;
            --warning-hover: rgba(240, 195, 108, 0.12);
            --warning-line: rgba(240, 195, 108, 0.28);
            --warning-item-line: rgba(240, 195, 108, 0.24);
            --danger: #ff9aa8;
            --danger-soft: #3b2027;
            --focus: #8bbdff;
            --focus-ring: rgba(139, 189, 255, 0.3);
            --calendar-grid-line: rgba(82, 101, 116, 0.62);
            --event-shadow: 0 10px 22px rgba(0, 0, 0, 0.32);
            --dialog-backdrop: rgba(0, 0, 0, 0.56);
            --shadow: 0 18px 45px rgba(0, 0, 0, 0.26);
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--ink);
            background: var(--bg);
            font-family: var(--font);
        }

        button,
        input {
            font: inherit;
        }

        button {
            border: 1px solid var(--line);
            border-radius: var(--radius);
            color: var(--ink);
            background: var(--surface);
            cursor: pointer;
            transition: border-color 150ms ease, background 150ms ease, color 150ms ease, transform 150ms ease;
        }

        button:hover:not(:disabled) {
            border-color: var(--line-strong);
            background: var(--surface-muted);
        }

        button:active:not(:disabled) {
            transform: translateY(1px);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        a {
            color: var(--primary);
        }

        .app-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 24px;
            padding: 24px clamp(18px, 4vw, 48px);
            border-bottom: 1px solid var(--line);
            background: var(--surface);
        }

        .app-header > div:first-child {
            min-width: 0;
        }

        .eyebrow {
            margin: 0 0 5px;
            color: var(--primary);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0;
            text-transform: uppercase;
        }

        h1,
        h2,
        h3,
        p {
            margin-top: 0;
        }

        h1 {
            margin-bottom: 8px;
            font-size: clamp(1.75rem, 3vw, 2.45rem);
            line-height: 1.08;
            letter-spacing: 0;
        }

        h2 {
            margin-bottom: 4px;
            font-size: 1.05rem;
            letter-spacing: 0;
        }

        .status-line {
            max-width: 760px;
            margin-bottom: 0;
            color: var(--muted);
            font-size: 0.94rem;
            line-height: 1.45;
            overflow-wrap: anywhere;
        }

        .status-line[data-tone="error"] {
            color: var(--danger);
        }

        .status-line[data-tone="ok"] {
            color: var(--primary-dark);
        }

        .header-actions,
        .button-row,
        .toolbar-actions,
        .input-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-actions {
            flex-wrap: wrap;
            flex-shrink: 0;
            justify-content: flex-end;
        }

        .link-button,
        .small-button,
        .icon-button,
        .primary-action {
            min-height: 38px;
            padding: 0 13px;
            text-decoration: none;
        }

        .link-button {
            display: inline-flex;
            align-items: center;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            color: var(--ink);
            background: var(--surface);
        }

        .primary-action {
            width: 100%;
            min-height: 46px;
            position: sticky;
            bottom: 14px;
            z-index: 5;
            border-color: var(--primary-action-hover);
            color: var(--on-primary);
            background: var(--primary-action-bg);
            font-weight: 700;
            box-shadow: var(--primary-action-shadow);
        }

        .primary-action:hover:not(:disabled) {
            border-color: var(--primary-action-hover);
            color: var(--on-primary);
            background: var(--primary-action-hover);
        }

        .icon-button {
            min-width: 38px;
            padding: 0 11px;
        }

        .theme-button {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.05rem;
        }

        .theme-button-icon {
            display: inline-flex;
            width: 1em;
            height: 1em;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .app-shell {
            display: grid;
            grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
            gap: 22px;
            padding: 22px clamp(14px, 3vw, 34px) 34px;
        }

        .selection-panel,
        .calendar-panel {
            min-width: 0;
        }

        .selection-panel {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .control-section,
        .calendar-panel {
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .control-section {
            padding: 16px;
        }

        .calendar-panel {
            padding: 18px;
        }

        .section-title,
        .calendar-toolbar {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 14px;
        }

        .calendar-toolbar {
            margin-bottom: 14px;
        }

        .metric {
            display: inline-flex;
            min-width: 36px;
            justify-content: center;
            border-radius: 999px;
            padding: 3px 9px;
            color: var(--primary-dark);
            background: var(--primary-soft);
            font-size: 0.82rem;
            font-weight: 700;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 700;
        }

        input[type="search"],
        input[type="url"],
        input[type="text"] {
            width: 100%;
            min-height: 40px;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 0 12px;
            color: var(--ink);
            background: var(--surface);
        }

        input:focus,
        button:focus-visible,
        a:focus-visible,
        .module-option:focus-within,
        .event-card:focus-visible {
            outline: 3px solid var(--focus-ring);
            outline-offset: 2px;
        }

        .input-row {
            align-items: stretch;
        }

        .input-row input {
            min-width: 0;
        }

        .module-search {
            margin: 8px 0 10px;
        }

        .button-row {
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .small-button {
            min-height: 34px;
            font-size: 0.86rem;
        }

        .module-list {
            display: grid;
            gap: 8px;
            max-height: min(46vh, 560px);
            overflow: auto;
            padding-right: 4px;
        }

        .module-option {
            display: grid;
            grid-template-columns: 20px 10px minmax(0, 1fr);
            gap: 10px;
            align-items: start;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 10px;
            background: var(--surface);
        }

        .module-option input {
            margin: 2px 0 0;
        }

        .module-dot {
            width: 10px;
            height: 10px;
            margin-top: 5px;
            border-radius: 50%;
            background: var(--primary);
        }

        .module-name {
            display: block;
            margin-bottom: 4px;
            font-size: 0.93rem;
            font-weight: 700;
            line-height: 1.25;
            overflow-wrap: anywhere;
        }

        .module-meta {
            display: block;
            color: var(--muted);
            font-size: 0.79rem;
            line-height: 1.35;
            overflow-wrap: anywhere;
        }

        .tabs {
            display: inline-flex;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            overflow: hidden;
            background: var(--surface);
        }

        .tab-button {
            min-height: 36px;
            border: 0;
            border-radius: 0;
            padding: 0 12px;
            color: var(--muted);
            background: transparent;
        }

        .tab-button[aria-selected="true"] {
            color: var(--control-active-ink);
            background: var(--control-active-bg);
        }

        .toolbar-actions {
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .calendar-summary {
            margin-bottom: 0;
            color: var(--muted);
            font-size: 0.9rem;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }

        .conflict-panel {
            display: none;
            margin: 0 0 14px;
            border: 1px solid var(--warning);
            border-radius: var(--radius);
            color: var(--warning);
            background: var(--warning-soft);
            font-size: 0.9rem;
        }

        .conflict-panel.is-visible {
            display: block;
        }

        .conflict-toggle {
            display: flex;
            width: 100%;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            min-height: 42px;
            border: 0;
            border-radius: var(--radius);
            padding: 10px 12px;
            color: var(--warning);
            background: transparent;
            text-align: left;
            font-weight: 700;
        }

        .conflict-toggle:hover {
            background: var(--warning-hover);
        }

        .conflict-toggle span:last-child {
            flex-shrink: 0;
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 700;
        }

        .conflict-details {
            display: none;
            gap: 8px;
            border-top: 1px solid var(--warning-line);
            padding: 10px 12px 12px;
        }

        .conflict-panel.is-expanded .conflict-details {
            display: grid;
        }

        .conflict-item {
            border: 1px solid var(--warning-item-line);
            border-radius: var(--radius);
            padding: 10px;
            background: var(--surface-translucent);
        }

        .conflict-item strong,
        .conflict-item span {
            display: block;
            overflow-wrap: anywhere;
        }

        .conflict-item strong {
            color: var(--ink);
            font-size: 0.9rem;
        }

        .conflict-item span {
            margin-top: 4px;
            color: var(--muted);
            line-height: 1.4;
        }

        .empty-state {
            display: grid;
            min-height: 420px;
            place-items: center;
            border: 1px dashed var(--line-strong);
            border-radius: var(--radius);
            color: var(--muted);
            text-align: center;
            padding: 30px;
        }

        .empty-state strong {
            display: block;
            margin-bottom: 6px;
            color: var(--ink);
            font-size: 1.08rem;
        }

        .view {
            display: none;
        }

        .view.is-active {
            display: block;
        }

        .calendar-scroll {
            overflow-x: auto;
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--surface);
        }

        .mobile-calendar {
            display: none;
        }

        .week-calendar {
            min-width: 1120px;
        }

        .week-header,
        .week-body {
            display: grid;
            grid-template-columns: 72px repeat(7, minmax(145px, 1fr));
        }

        .week-header {
            position: sticky;
            top: 0;
            z-index: 3;
            border-bottom: 1px solid var(--line);
            background: var(--surface);
        }

        .time-spacer,
        .day-heading {
            min-height: 58px;
            padding: 10px;
        }

        .time-spacer {
            border-right: 1px solid var(--line);
            color: var(--muted);
            font-size: 0.78rem;
        }

        .day-heading {
            border-right: 1px solid var(--line);
        }

        .day-heading:last-child {
            border-right: 0;
        }

        .day-heading strong,
        .day-heading span {
            display: block;
        }

        .day-heading strong {
            margin-bottom: 2px;
            font-size: 0.93rem;
        }

        .day-heading span {
            color: var(--muted);
            font-size: 0.78rem;
        }

        .day-heading.is-today {
            color: var(--primary-dark);
            background: var(--primary-soft);
        }

        .time-axis,
        .day-column {
            position: relative;
            min-height: 360px;
        }

        .time-axis {
            border-right: 1px solid var(--line);
            background: var(--surface-subtle);
        }

        .hour-label {
            position: absolute;
            right: 9px;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 0.76rem;
        }

        .day-column {
            border-right: 1px solid var(--line);
            background-image: repeating-linear-gradient(
                to bottom,
                transparent 0,
                transparent 59px,
                var(--calendar-grid-line) 60px
            );
        }

        .day-column:last-child {
            border-right: 0;
        }

        .event-card {
            position: absolute;
            z-index: 1;
            overflow: hidden;
            border: 1px solid var(--event-border);
            border-radius: var(--radius);
            padding: 8px;
            color: var(--ink);
            background: var(--event-bg);
            text-align: left;
            box-shadow: var(--event-shadow);
        }

        .event-card.is-conflict {
            --event-bg: var(--danger-soft);
            --event-border: var(--danger);
        }

        .event-card:hover {
            z-index: 2;
        }

        .event-card strong,
        .event-card span,
        .event-card small {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .event-card strong {
            margin-bottom: 5px;
            font-size: 0.78rem;
            line-height: 1.2;
        }

        .event-card span {
            font-size: 0.72rem;
        }

        .event-card small {
            margin-top: 4px;
            color: var(--muted);
            font-size: 0.68rem;
        }

        .mobile-day-strip {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: thin;
        }

        .mobile-day-button {
            display: grid;
            min-width: 78px;
            min-height: 58px;
            align-content: center;
            gap: 3px;
            padding: 8px;
            text-align: left;
        }

        .mobile-day-button strong,
        .mobile-day-button span {
            display: block;
        }

        .mobile-day-button strong {
            font-size: 0.88rem;
        }

        .mobile-day-button span {
            color: var(--muted);
            font-size: 0.76rem;
        }

        .mobile-day-button.is-today {
            border-color: var(--primary);
            color: var(--primary-dark);
            background: var(--primary-soft);
        }

        .mobile-week-list {
            display: grid;
            gap: 12px;
        }

        .mobile-day-section {
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--surface);
            overflow: hidden;
        }

        .mobile-day-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border-bottom: 1px solid var(--line);
            padding: 10px 12px;
            background: var(--surface-subtle);
        }

        .mobile-day-header h3 {
            margin: 0;
            font-size: 0.96rem;
        }

        .mobile-day-events {
            display: grid;
            gap: 8px;
            padding: 10px;
        }

        .mobile-event-card {
            display: grid;
            grid-template-columns: minmax(68px, 82px) minmax(0, 1fr);
            gap: 8px 10px;
            width: 100%;
            border: 1px solid var(--event-border);
            border-left-width: 4px;
            border-radius: var(--radius);
            padding: 10px;
            color: var(--ink);
            background: var(--event-bg);
            text-align: left;
        }

        .mobile-event-card.is-conflict {
            --event-bg: var(--danger-soft);
            --event-border: var(--danger);
        }

        .mobile-event-time {
            color: var(--primary-dark);
            font-size: 0.82rem;
            font-weight: 700;
            line-height: 1.3;
        }

        .mobile-event-body {
            min-width: 0;
        }

        .mobile-event-body strong,
        .mobile-event-body span {
            display: block;
            overflow-wrap: anywhere;
        }

        .mobile-event-body strong {
            margin-bottom: 4px;
            font-size: 0.9rem;
            line-height: 1.25;
        }

        .mobile-event-meta {
            color: var(--muted);
            font-size: 0.8rem;
            line-height: 1.35;
        }

        .mobile-empty-day {
            margin: 0;
            padding: 12px;
            color: var(--muted);
            font-size: 0.88rem;
        }

        .agenda {
            display: grid;
            gap: 12px;
        }

        .day-agenda {
            border: 1px solid var(--line);
            border-radius: var(--radius);
            background: var(--surface);
        }

        .day-agenda header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            border-bottom: 1px solid var(--line);
            padding: 10px 12px;
            background: var(--surface-subtle);
        }

        .day-agenda h3 {
            margin: 0;
            font-size: 0.96rem;
        }

        .agenda-event {
            display: grid;
            grid-template-columns: 100px minmax(0, 1fr);
            gap: 12px;
            width: 100%;
            border: 0;
            border-bottom: 1px solid var(--line);
            border-radius: 0;
            padding: 12px;
            background: transparent;
            text-align: left;
        }

        .agenda-event:hover {
            background: var(--surface-muted);
        }

        .agenda-event.is-conflict {
            background: var(--danger-soft);
            box-shadow: inset 4px 0 0 var(--danger);
        }

        .agenda-event.is-conflict:hover {
            background: var(--danger-soft);
        }

        .agenda-event.is-conflict .agenda-time {
            color: var(--danger);
        }

        .agenda-event:last-child {
            border-bottom: 0;
        }

        .agenda-time {
            color: var(--primary-dark);
            font-weight: 700;
            white-space: nowrap;
        }

        .agenda-title {
            margin-bottom: 5px;
            font-weight: 700;
        }

        .agenda-meta {
            color: var(--muted);
            font-size: 0.86rem;
            line-height: 1.45;
            overflow-wrap: anywhere;
        }

        dialog {
            width: min(520px, calc(100vw - 32px));
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 0;
            color: var(--ink);
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        dialog::backdrop {
            background: var(--dialog-backdrop);
        }

        .dialog-header {
            display: flex;
            align-items: start;
            justify-content: space-between;
            gap: 12px;
            border-bottom: 1px solid var(--line);
            padding: 16px;
        }

        .dialog-header h3 {
            margin: 0;
            font-size: 1.08rem;
        }

        .dialog-body {
            padding: 16px;
        }

        .event-details {
            display: grid;
            grid-template-columns: 110px minmax(0, 1fr);
            gap: 9px 12px;
            margin: 0;
        }

        .event-details dt {
            color: var(--muted);
            font-weight: 700;
        }

        .event-details dd {
            margin: 0;
            overflow-wrap: anywhere;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 980px) {
            .app-header,
            .app-shell {
                display: block;
            }

            .header-actions {
                justify-content: flex-start;
                margin-top: 16px;
            }

            .selection-panel {
                margin-bottom: 18px;
            }

            .calendar-toolbar {
                display: block;
            }

            .toolbar-actions {
                justify-content: flex-start;
                margin-top: 12px;
            }
        }

        @media (max-width: 700px) {
            .calendar-scroll {
                display: none;
            }

            .mobile-calendar {
                display: block;
            }

            .calendar-toolbar h2 {
                font-size: 1rem;
            }

            .calendar-summary {
                font-size: 0.84rem;
            }
        }

        @media (max-width: 560px) {
            .app-header {
                padding: 20px 14px;
            }

            .app-shell {
                padding: 14px;
            }

            .input-row {
                display: grid;
            }

            .calendar-panel,
            .control-section {
                padding: 14px;
            }

            .agenda-event {
                grid-template-columns: 1fr;
                gap: 5px;
            }
        }
    </style>
</head>
<body>
    <header class="app-header">
        <div>
            <p class="eyebrow"></p>
            <h1>Stundenplan Picker</h1>
            <p id="sourceStatus" class="status-line" data-tone="muted">Stundenplan wird geladen...</p>
        </div>
        <div class="header-actions">
            <button id="themeToggle" class="icon-button theme-button" type="button" aria-label="Dark Mode aktivieren" aria-pressed="false" title="Dark Mode aktivieren">
                <span id="themeToggleIcon" class="theme-button-icon" aria-hidden="true">&#9790;</span>
            </button>
            <a class="link-button" href="https://sked.lin.hs-osnabrueck.de/sked/jg/24VTS.html" target="_blank" rel="noopener">Quelle öffnen</a>
            <button id="reloadButton" class="small-button" type="button">Aktualisieren</button>
        </div>
    </header>

    <main class="app-shell">
        <aside class="selection-panel" aria-label="Auswahl">
            <section class="control-section">
                <label for="scheduleUrl">Stundenplan-URL</label>
                <div class="input-row">
                    <input id="scheduleUrl" type="url" autocomplete="url" spellcheck="false">
                    <button id="loadUrlButton" class="small-button" type="button">Laden</button>
                </div>

                <input id="proxyPrefix" type="hidden">
            </section>

            <section class="control-section">
                <div class="section-title">
                    <div>
                        <h2>Module</h2>
                        <p class="calendar-summary" id="selectionSummary">Noch keine Daten geladen.</p>
                    </div>
                    <span id="moduleCount" class="metric">0</span>
                </div>

                <input id="moduleSearch" class="module-search" type="search" placeholder="Modul, Dozent, Gruppe oder Raum suchen" autocomplete="off">

                <div class="button-row">
                    <button id="selectVisibleButton" class="small-button" type="button">Sichtbare wählen</button>
                    <button id="clearSelectionButton" class="small-button" type="button">Auswahl leeren</button>
                </div>

                <div id="moduleList" class="module-list" aria-live="polite"></div>
            </section>

            <button id="buildButton" class="primary-action" type="button" disabled>Kalender bauen</button>
        </aside>

        <section class="calendar-panel" aria-label="Kalender">
            <div class="calendar-toolbar">
                <div>
                    <h2 id="calendarTitle">Kalender</h2>
                    <p id="calendarSummary" class="calendar-summary">Wähle Module aus und baue deinen Kalender.</p>
                </div>
                <div class="toolbar-actions">
                    <button id="previousWeekButton" class="icon-button" type="button" title="Vorherige Woche" aria-label="Vorherige Woche">‹</button>
                    <button id="todayButton" class="small-button" type="button">Heute</button>
                    <button id="nextWeekButton" class="icon-button" type="button" title="Nächste Woche" aria-label="Nächste Woche">›</button>
                    <button id="exportButton" class="small-button" type="button" disabled>ICS exportieren</button>
                    <div class="tabs" role="tablist" aria-label="Ansicht">
                        <button id="calendarTab" class="tab-button" type="button" role="tab" aria-selected="true" data-view="calendar">Woche</button>
                        <button id="listTab" class="tab-button" type="button" role="tab" aria-selected="false" data-view="list">Liste</button>
                    </div>
                </div>
            </div>

            <div id="conflictPanel" class="conflict-panel">
                <button id="conflictToggle" class="conflict-toggle" type="button" aria-expanded="false" aria-controls="conflictDetails">
                    <span id="conflictSummary"></span>
                    <span id="conflictToggleLabel">Details anzeigen</span>
                </button>
                <div id="conflictDetails" class="conflict-details" aria-hidden="true"></div>
            </div>

            <div id="emptyState" class="empty-state">
                <div>
                    <strong>Noch kein Kalender</strong>
                    <span>Die ausgewählten Module erscheinen hier.</span>
                </div>
            </div>

            <div id="calendarView" class="view is-active">
                <div class="calendar-scroll">
                    <div id="weekCalendar" class="week-calendar"></div>
                </div>
                <div id="mobileCalendar" class="mobile-calendar" aria-label="Mobile Wochenansicht"></div>
            </div>

            <div id="listView" class="view">
                <div id="agendaList" class="agenda"></div>
            </div>
        </section>
    </main>

    <dialog id="eventDialog">
        <div class="dialog-header">
            <h3 id="dialogTitle"></h3>
            <button id="closeDialogButton" class="icon-button" type="button" title="Schließen" aria-label="Schließen">×</button>
        </div>
        <div class="dialog-body">
            <dl id="dialogDetails" class="event-details"></dl>
        </div>
    </dialog>

    <script>
        (() => {
            const DEFAULT_URL = "https://sked.lin.hs-osnabrueck.de/sked/jg/24VTS.html";
            const DEFAULT_PROXY_PREFIX = "https://proxy.cors.sh/";
            const PIXELS_PER_MINUTE = 1;
            const STORAGE_KEYS = {
                url: "stundenplan-picker:url",
                proxy: "stundenplan-picker:proxy",
                selection: "stundenplan-picker:selection",
                renderedSelection: "stundenplan-picker:rendered-selection",
                theme: "stundenplan-picker:theme"
            };
            const COLOR_PALETTE = [
                ["#e1f2ef", "#006b5f"],
                ["#eaf0fb", "#2f5ea8"],
                ["#fff4d8", "#996200"],
                ["#ffe6e9", "#9c2f3b"],
                ["#edf6de", "#54731f"],
                ["#f0eafb", "#6a4aa3"],
                ["#e6f4fb", "#19718e"],
                ["#f9e9dc", "#9a5426"],
                ["#ecf0f1", "#51606c"],
                ["#fbe7f0", "#a13268"]
            ];
            const WEEKDAYS = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"];
            const MONTHS = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];

            const state = {
                events: [],
                modules: [],
                selectedModules: new Set(),
                renderedModules: new Set(),
                visibleWeekStart: null,
                activeView: "calendar",
                lastLoadedLabel: "",
                lastLoadedVia: "",
                pendingSelection: [],
                autoBuild: false,
                conflictsExpanded: false
            };

            const els = {};

            document.addEventListener("DOMContentLoaded", init);

            function init() {
                cacheElements();
                applyTheme(getActiveTheme(), false);
                bindEvents();
                const params = new URLSearchParams(window.location.search);
                els.scheduleUrl.value = params.get("source") || readStorage(STORAGE_KEYS.url, DEFAULT_URL);
                els.proxyPrefix.value = params.get("proxy") || readStorage(STORAGE_KEYS.proxy, "");
                state.pendingSelection = params.getAll("select").flatMap((value) => value.split(",")).map((value) => value.trim()).filter(Boolean);
                state.autoBuild = params.get("build") === "1";
                loadRemoteSchedule();
            }

            function cacheElements() {
                els.themeToggle = document.getElementById("themeToggle");
                els.themeToggleIcon = document.getElementById("themeToggleIcon");
                els.sourceStatus = document.getElementById("sourceStatus");
                els.reloadButton = document.getElementById("reloadButton");
                els.scheduleUrl = document.getElementById("scheduleUrl");
                els.loadUrlButton = document.getElementById("loadUrlButton");
                els.proxyPrefix = document.getElementById("proxyPrefix");
                els.moduleCount = document.getElementById("moduleCount");
                els.selectionSummary = document.getElementById("selectionSummary");
                els.moduleSearch = document.getElementById("moduleSearch");
                els.selectVisibleButton = document.getElementById("selectVisibleButton");
                els.clearSelectionButton = document.getElementById("clearSelectionButton");
                els.moduleList = document.getElementById("moduleList");
                els.buildButton = document.getElementById("buildButton");
                els.calendarTitle = document.getElementById("calendarTitle");
                els.calendarSummary = document.getElementById("calendarSummary");
                els.previousWeekButton = document.getElementById("previousWeekButton");
                els.todayButton = document.getElementById("todayButton");
                els.nextWeekButton = document.getElementById("nextWeekButton");
                els.exportButton = document.getElementById("exportButton");
                els.conflictPanel = document.getElementById("conflictPanel");
                els.conflictToggle = document.getElementById("conflictToggle");
                els.conflictSummary = document.getElementById("conflictSummary");
                els.conflictToggleLabel = document.getElementById("conflictToggleLabel");
                els.conflictDetails = document.getElementById("conflictDetails");
                els.emptyState = document.getElementById("emptyState");
                els.calendarView = document.getElementById("calendarView");
                els.listView = document.getElementById("listView");
                els.weekCalendar = document.getElementById("weekCalendar");
                els.mobileCalendar = document.getElementById("mobileCalendar");
                els.agendaList = document.getElementById("agendaList");
                els.calendarTab = document.getElementById("calendarTab");
                els.listTab = document.getElementById("listTab");
                els.eventDialog = document.getElementById("eventDialog");
                els.dialogTitle = document.getElementById("dialogTitle");
                els.dialogDetails = document.getElementById("dialogDetails");
                els.closeDialogButton = document.getElementById("closeDialogButton");
            }

            function bindEvents() {
                els.themeToggle.addEventListener("click", () => {
                    applyTheme(getActiveTheme() === "dark" ? "light" : "dark", true);
                });
                els.reloadButton.addEventListener("click", loadRemoteSchedule);
                els.loadUrlButton.addEventListener("click", loadRemoteSchedule);
                els.scheduleUrl.addEventListener("change", loadRemoteSchedule);
                els.proxyPrefix.addEventListener("change", () => {
                    writeStorage(STORAGE_KEYS.proxy, els.proxyPrefix.value.trim());
                });
                els.moduleSearch.addEventListener("input", renderModuleList);
                els.selectVisibleButton.addEventListener("click", selectVisibleModules);
                els.clearSelectionButton.addEventListener("click", clearSelection);
                els.buildButton.addEventListener("click", buildCalendar);
                els.previousWeekButton.addEventListener("click", () => shiftWeek(-1));
                els.nextWeekButton.addEventListener("click", () => shiftWeek(1));
                els.todayButton.addEventListener("click", jumpToToday);
                els.exportButton.addEventListener("click", exportIcs);
                document.addEventListener("click", handleDocumentClick);
                els.calendarTab.addEventListener("click", () => switchView("calendar"));
                els.listTab.addEventListener("click", () => switchView("list"));
                els.closeDialogButton.addEventListener("click", () => els.eventDialog.close());
            }

            function handleDocumentClick(event) {
                const target = event.target instanceof Element ? event.target : null;
                if (target?.closest("#conflictToggle")) {
                    event.preventDefault();
                    toggleConflictDetails();
                }
            }

            function getActiveTheme() {
                return document.documentElement.dataset.theme === "dark" ? "dark" : "light";
            }

            function applyTheme(theme, persist) {
                const nextTheme = theme === "dark" ? "dark" : "light";
                const isDark = nextTheme === "dark";
                const nextLabel = isDark ? "White Mode aktivieren" : "Dark Mode aktivieren";
                document.documentElement.dataset.theme = nextTheme;
                els.themeToggle.setAttribute("aria-pressed", String(isDark));
                els.themeToggle.setAttribute("aria-label", nextLabel);
                els.themeToggle.title = nextLabel;
                els.themeToggleIcon.textContent = isDark ? "\u2600" : "\u263e";

                if (persist) {
                    writeStorage(STORAGE_KEYS.theme, nextTheme);
                }
            }

            async function loadRemoteSchedule() {
                const sourceUrl = els.scheduleUrl.value.trim() || DEFAULT_URL;
                const proxyPrefix = els.proxyPrefix.value.trim();
                writeStorage(STORAGE_KEYS.url, sourceUrl);
                writeStorage(STORAGE_KEYS.proxy, proxyPrefix);
                setSourceStatus("Stundenplan wird geladen...", "muted");
                setLoading(true);

                try {
                    const result = await fetchSchedule(sourceUrl, proxyPrefix);
                    consumeSchedule(result.html, sourceUrl, result.via);
                } catch (error) {
                    if (!state.events.length) {
                        state.modules = [];
                        state.selectedModules.clear();
                        state.renderedModules.clear();
                        renderModuleList();
                        renderCalendar();
                    }
                    setSourceStatus("Stundenplan konnte nicht automatisch geladen werden. Bitte später erneut versuchen.", "error");
                    console.warn(error);
                } finally {
                    setLoading(false);
                }
            }

            async function fetchSchedule(sourceUrl, proxyPrefix) {
                const attempts = [{ via: "Abruf 1", url: sourceUrl }];
                if (proxyPrefix) {
                    attempts.push({ via: "Abruf 2", url: buildProxyUrl(proxyPrefix, sourceUrl) });
                }
                attempts.push({ via: "Abruf 3", url: DEFAULT_PROXY_PREFIX + sourceUrl });

                let lastError = null;
                for (const attempt of attempts) {
                    try {
                        const response = await fetchWithTimeout(attempt.url, { cache: "no-store" }, 15000);
                        if (!response.ok) {
                            throw new Error(`${attempt.via}: HTTP ${response.status}`);
                        }
                        const html = await response.text();
                        if (!looksLikeSkedPage(html)) {
                            throw new Error(`${attempt.via}: Die Antwort sieht nicht wie ein sked-Stundenplan aus.`);
                        }
                        return { html, via: attempt.via };
                    } catch (error) {
                        lastError = error;
                    }
                }

                throw lastError || new Error("Kein Abrufversuch möglich.");
            }

            function buildProxyUrl(prefix, sourceUrl) {
                if (prefix.includes("{url}")) {
                    return prefix.replaceAll("{url}", encodeURIComponent(sourceUrl));
                }

                if (/[?&](url|quest)=$/i.test(prefix)) {
                    return prefix + encodeURIComponent(sourceUrl);
                }

                return prefix + sourceUrl;
            }

            function fetchWithTimeout(url, options, timeoutMs) {
                const controller = new AbortController();
                const timeout = window.setTimeout(() => controller.abort(), timeoutMs);
                return fetch(url, { ...options, signal: controller.signal }).finally(() => {
                    window.clearTimeout(timeout);
                });
            }

            function looksLikeSkedPage(html) {
                return /<table[^>]+class=['"]tbl/i.test(html) && /Veranstaltung/i.test(html);
            }

            function consumeSchedule(html, label, via) {
                const parsed = parseSchedule(html);
                if (!parsed.events.length) {
                    throw new Error("Keine Veranstaltungen im Stundenplan gefunden.");
                }

                state.events = parsed.events;
                state.modules = buildModules(parsed.events);
                state.lastLoadedLabel = label;
                state.lastLoadedVia = via;
                restoreSelection();
                applyPendingSelection();
                restoreRenderedSelection();
                if (state.autoBuild && state.selectedModules.size) {
                    state.renderedModules = new Set(state.selectedModules);
                    persistRenderedSelection();
                }
                state.visibleWeekStart = chooseInitialWeek(getRenderedEvents()) || chooseInitialWeek(state.events);

                renderModuleList();
                updateBuildButton();
                renderCalendar();

                const meta = [parsed.title, parsed.stand ? `Stand: ${parsed.stand}` : "", `${parsed.events.length} Termine`].filter(Boolean).join(" · ");
                setSourceStatus(meta, "ok");
            }

            function parseSchedule(html) {
                const doc = new DOMParser().parseFromString(html, "text/html");
                const title = cleanText(doc.querySelector(".w1")?.textContent || doc.querySelector("title")?.textContent || "Stundenplan");
                const stand = html.match(/Stand:\s*([0-9]{2}\.[0-9]{2}\.[0-9]{4},\s*[0-9]{1,2}:[0-9]{2}\s*Uhr)/)?.[1] || "";
                const rows = [...doc.querySelectorAll("table.tbl tr")];
                const events = [];
                let currentDateText = "";

                rows.forEach((row) => {
                    if (!/^zf/i.test(row.id || "")) return;
                    const cells = [...row.querySelectorAll("td")];
                    if (cells.length < 16) return;

                    const dateText = cleanText(cells[0].textContent);
                    if (dateText) currentDateText = dateText;
                    const date = parseGermanDate(currentDateText);
                    const start = readTime(cells[2].textContent);
                    const end = readTime(cells[3].textContent);
                    const course = cleanText(cells[9].textContent);
                    if (!date || !start || !end || !course) return;

                    const event = {
                        id: row.id,
                        date,
                        dateIso: toIsoDate(date),
                        dayLabel: formatLongDate(date),
                        weekday: WEEKDAYS[(date.getDay() + 6) % 7],
                        start,
                        end,
                        startMinutes: timeToMinutes(start),
                        endMinutes: timeToMinutes(end),
                        type: cleanText(cells[7].textContent),
                        course,
                        lecturer: cleanText(cells[11].textContent),
                        room: cleanText(cells[13].textContent),
                        groups: cleanText(cells[15].textContent),
                        duration: cleanText(cells[5].textContent)
                    };
                    events.push(event);
                });

                events.sort(compareEvents);
                return { title, stand, events };
            }

            function buildModules(events) {
                const map = new Map();
                events.forEach((event) => {
                    const moduleId = createModuleId(event);
                    const studyGroup = getStudyGroupLabel(event.groups);
                    if (!map.has(moduleId)) {
                        map.set(moduleId, {
                            id: moduleId,
                            name: event.course,
                            lecturer: event.lecturer || "ohne Dozent",
                            studyGroup,
                            count: 0,
                            firstDate: event.dateIso,
                            groups: new Set(),
                            lecturers: new Set(),
                            rooms: new Set(),
                            colorIndex: map.size % COLOR_PALETTE.length
                        });
                    }
                    const module = map.get(moduleId);
                    event.moduleId = moduleId;
                    event.colorIndex = module.colorIndex;
                    module.count += 1;
                    module.firstDate = module.firstDate < event.dateIso ? module.firstDate : event.dateIso;
                    splitList(event.groups).forEach((group) => module.groups.add(group));
                    splitList(event.lecturer).forEach((lecturer) => module.lecturers.add(lecturer));
                    splitList(event.room).forEach((room) => module.rooms.add(room));
                });

                return [...map.values()].sort((a, b) => {
                    return a.name.localeCompare(b.name, "de")
                        || a.lecturer.localeCompare(b.lecturer, "de")
                        || a.studyGroup.localeCompare(b.studyGroup, "de");
                });
            }

            function restoreSelection() {
                const available = new Set(state.modules.map((module) => module.id));
                const saved = readStoredList(STORAGE_KEYS.selection);
                const merged = new Set(resolveSelectionTokens([...state.selectedModules, ...saved]).filter((id) => available.has(id)));
                state.selectedModules = merged;
            }

            function restoreRenderedSelection() {
                const available = new Set(state.modules.map((module) => module.id));
                const saved = readStoredList(STORAGE_KEYS.renderedSelection);
                const current = [...state.renderedModules];
                const tokens = saved.length ? saved : current;
                const restored = resolveSelectionTokens(tokens)
                    .filter((id) => available.has(id) && state.selectedModules.has(id));
                state.renderedModules = new Set(restored);
            }

            function applyPendingSelection() {
                if (!state.pendingSelection.length) return;
                const targets = state.pendingSelection.map(normalizeSearch);
                state.selectedModules = new Set(state.modules
                    .filter((module) => targets.some((target) => normalizeSearch(getModuleLabel(module)).includes(target)))
                    .map((module) => module.id));
                state.pendingSelection = [];
                persistSelection();
            }

            function createModuleId(event) {
                return `${event.course}@@${event.lecturer || "ohne Dozent"}@@${getStudyGroupLabel(event.groups)}`;
            }

            function getStudyGroupLabel(groups) {
                const values = splitList(groups).sort((a, b) => a.localeCompare(b, "de"));
                return values.length ? values.join(", ") : "ohne Studiengruppe";
            }

            function getModuleLabel(module) {
                return `${getLegacyModuleLabel(module)} · ${module.studyGroup}`;
            }

            function getLegacyModuleLabel(module) {
                return `${module.name} · ${module.lecturer}`;
            }

            function getLegacyModuleId(module) {
                return `${module.name}@@${module.lecturer || "ohne Dozent"}`;
            }

            function resolveSelectionTokens(tokens) {
                const ids = new Set(state.modules.map((module) => module.id));
                const labels = new Map(state.modules.map((module) => [getModuleLabel(module), module.id]));
                return tokens.flatMap((token) => {
                    if (ids.has(token)) return [token];
                    if (labels.has(token)) return [labels.get(token)];

                    const exactLegacyIdMatches = state.modules.filter((module) => getLegacyModuleId(module) === token);
                    if (exactLegacyIdMatches.length === 1) return [exactLegacyIdMatches[0].id];

                    const exactLegacyLabelMatches = state.modules.filter((module) => getLegacyModuleLabel(module) === token);
                    if (exactLegacyLabelMatches.length === 1) return [exactLegacyLabelMatches[0].id];

                    const exactNameMatches = state.modules.filter((module) => module.name === token);
                    return exactNameMatches.length === 1 ? [exactNameMatches[0].id] : [];
                });
            }

            function renderModuleList() {
                const query = normalizeSearch(els.moduleSearch.value);
                const modules = getFilteredModules(query);
                els.moduleList.innerHTML = "";

                if (!state.modules.length) {
                    els.moduleList.append(createEmptyMessage("Keine Module geladen."));
                } else if (!modules.length) {
                    els.moduleList.append(createEmptyMessage("Keine Treffer."));
                } else {
                    const fragment = document.createDocumentFragment();
                    modules.forEach((module) => fragment.append(createModuleOption(module)));
                    els.moduleList.append(fragment);
                }

                els.moduleCount.textContent = String(state.modules.length);
                updateSelectionSummary();
                updateBuildButton();
            }

            function createModuleOption(module) {
                const label = document.createElement("label");
                label.className = "module-option";

                const input = document.createElement("input");
                input.type = "checkbox";
                input.checked = state.selectedModules.has(module.id);
                input.addEventListener("change", () => {
                    if (input.checked) {
                        state.selectedModules.add(module.id);
                    } else {
                        state.selectedModules.delete(module.id);
                    }
                    persistSelection();
                    updateSelectionSummary();
                    updateBuildButton();
                });

                const dot = document.createElement("span");
                dot.className = "module-dot";
                dot.style.background = COLOR_PALETTE[module.colorIndex][1];

                const body = document.createElement("span");
                const name = document.createElement("span");
                name.className = "module-name";
                name.textContent = module.name;
                const meta = document.createElement("span");
                meta.className = "module-meta";
                meta.textContent = `Dozent: ${module.lecturer} · Studiengruppe: ${module.studyGroup} · ${formatTermCount(module.count)}`;
                body.append(name, meta);

                label.append(input, dot, body);
                return label;
            }

            function createEmptyMessage(text) {
                const message = document.createElement("p");
                message.className = "calendar-summary";
                message.textContent = text;
                return message;
            }

            function selectVisibleModules() {
                getFilteredModules(normalizeSearch(els.moduleSearch.value)).forEach((module) => {
                    state.selectedModules.add(module.id);
                });
                persistSelection();
                renderModuleList();
            }

            function clearSelection() {
                state.selectedModules.clear();
                state.renderedModules.clear();
                persistCalendarState();
                renderModuleList();
                renderCalendar();
            }

            function buildCalendar() {
                state.renderedModules = new Set(state.selectedModules);
                state.visibleWeekStart = chooseInitialWeek(getRenderedEvents());
                persistCalendarState();
                renderCalendar();
            }

            function renderCalendar() {
                const selectedEvents = getRenderedEvents();
                const hasCalendar = selectedEvents.length > 0;
                els.emptyState.classList.toggle("hidden", hasCalendar);
                els.calendarView.classList.toggle("hidden", !hasCalendar);
                els.listView.classList.toggle("hidden", !hasCalendar);
                els.exportButton.disabled = !hasCalendar;
                els.previousWeekButton.disabled = !hasCalendar;
                els.nextWeekButton.disabled = !hasCalendar;
                els.todayButton.disabled = !hasCalendar;

                if (!hasCalendar) {
                    els.weekCalendar.innerHTML = "";
                    els.mobileCalendar.innerHTML = "";
                    els.agendaList.innerHTML = "";
                    els.calendarTitle.textContent = "Kalender";
                    els.calendarSummary.textContent = state.selectedModules.size ? "Kalender bauen, um die Auswahl anzuzeigen." : "Wähle Module aus und baue deinen Kalender.";
                    hideConflictPanel();
                    return;
                }

                if (!state.visibleWeekStart) {
                    state.visibleWeekStart = chooseInitialWeek(selectedEvents);
                }

                const weekStart = new Date(state.visibleWeekStart);
                const weekEnd = addDays(weekStart, 6);
                const weekEvents = selectedEvents.filter((event) => event.dateIso >= toIsoDate(weekStart) && event.dateIso <= toIsoDate(weekEnd));
                const conflicts = getConflicts(selectedEvents);
                const moduleCount = state.renderedModules.size;
                els.calendarTitle.textContent = `${formatShortDate(weekStart)} - ${formatShortDate(weekEnd)}`;
                els.calendarSummary.textContent = `${selectedEvents.length} Termine aus ${moduleCount} ${moduleCount === 1 ? "Angebot" : "Angeboten"}`;

                if (conflicts.length) {
                    renderConflictPanel(conflicts);
                } else {
                    hideConflictPanel();
                }

                renderWeek(weekStart, weekEvents, selectedEvents);
                renderMobileWeek(weekStart, weekEvents);
                renderAgenda(selectedEvents);
            }

            function renderWeek(weekStart, weekEvents, selectedEvents) {
                const range = getTimeRange(selectedEvents);
                const calendarHeight = (range.end - range.start) * PIXELS_PER_MINUTE;
                const days = Array.from({ length: 7 }, (_, index) => addDays(weekStart, index));
                const eventMap = new Map(days.map((day) => [toIsoDate(day), []]));
                weekEvents.forEach((event) => eventMap.get(event.dateIso)?.push(event));

                els.weekCalendar.innerHTML = "";
                const header = document.createElement("div");
                header.className = "week-header";
                const spacer = document.createElement("div");
                spacer.className = "time-spacer";
                spacer.textContent = "Zeit";
                header.append(spacer);

                const todayIso = toIsoDate(new Date());
                days.forEach((day) => {
                    const dayIso = toIsoDate(day);
                    const heading = document.createElement("div");
                    heading.className = `day-heading${dayIso === todayIso ? " is-today" : ""}`;
                    const dayName = document.createElement("strong");
                    dayName.textContent = WEEKDAYS[(day.getDay() + 6) % 7];
                    const date = document.createElement("span");
                    const dayEvents = eventMap.get(dayIso) || [];
                    date.textContent = `${formatShortDate(day)} · ${dayEvents.length}`;
                    heading.append(dayName, date);
                    header.append(heading);
                });

                const body = document.createElement("div");
                body.className = "week-body";
                const axis = document.createElement("div");
                axis.className = "time-axis";
                axis.style.height = `${calendarHeight}px`;
                renderHourLabels(axis, range);
                body.append(axis);

                days.forEach((day) => {
                    const dayIso = toIsoDate(day);
                    const column = document.createElement("div");
                    column.className = "day-column";
                    column.style.height = `${calendarHeight}px`;
                    const dayEvents = layoutDayEvents(eventMap.get(dayIso) || []);
                    dayEvents.forEach((event) => column.append(createEventCard(event, range)));
                    body.append(column);
                });

                els.weekCalendar.append(header, body);
            }

            function renderHourLabels(axis, range) {
                for (let minutes = range.start; minutes <= range.end; minutes += 60) {
                    const label = document.createElement("span");
                    label.className = "hour-label";
                    label.style.top = `${(minutes - range.start) * PIXELS_PER_MINUTE}px`;
                    label.textContent = minutesToTime(minutes);
                    axis.append(label);
                }
            }

            function createEventCard(event, range) {
                const card = document.createElement("button");
                const columnCount = event.layoutColumns || 1;
                const columnIndex = event.layoutColumn || 0;
                const gutter = 4;
                card.type = "button";
                card.className = `event-card${event.hasConflict ? " is-conflict" : ""}`;
                card.style.top = `${(event.startMinutes - range.start) * PIXELS_PER_MINUTE + 3}px`;
                card.style.height = `${Math.max(42, (event.endMinutes - event.startMinutes) * PIXELS_PER_MINUTE - 6)}px`;
                card.style.left = `calc(${(100 / columnCount) * columnIndex}% + ${gutter}px)`;
                card.style.width = `calc(${100 / columnCount}% - ${gutter * 2}px)`;
                card.title = `${event.course}\n${event.dayLabel}, ${event.start} - ${event.end}\n${event.room}\n${event.lecturer}`;

                const title = document.createElement("strong");
                title.textContent = event.course;
                const time = document.createElement("span");
                time.textContent = `${event.start} - ${event.end} · ${event.room || "Raum offen"}`;
                const details = document.createElement("small");
                details.textContent = [event.lecturer, event.groups].filter(Boolean).join(" · ") || event.type;
                card.append(title, time, details);
                card.addEventListener("click", () => showEventDialog(event));
                return card;
            }

            function renderMobileWeek(weekStart, weekEvents) {
                const days = Array.from({ length: 7 }, (_, index) => addDays(weekStart, index));
                const eventMap = new Map(days.map((day) => [toIsoDate(day), []]));
                weekEvents.forEach((event) => eventMap.get(event.dateIso)?.push(event));

                els.mobileCalendar.innerHTML = "";

                const strip = document.createElement("div");
                strip.className = "mobile-day-strip";
                const list = document.createElement("div");
                list.className = "mobile-week-list";
                const todayIso = toIsoDate(new Date());

                days.forEach((day) => {
                    const dayIso = toIsoDate(day);
                    const dayEvents = layoutDayEvents(eventMap.get(dayIso) || []).sort(compareEvents);
                    const sectionId = `mobile-day-${dayIso}`;

                    const dayButton = document.createElement("button");
                    dayButton.type = "button";
                    dayButton.className = `mobile-day-button${dayIso === todayIso ? " is-today" : ""}`;
                    dayButton.setAttribute("aria-controls", sectionId);
                    dayButton.setAttribute("aria-label", `${formatLongDate(day)}, ${formatTermCount(dayEvents.length)}`);
                    const dayName = document.createElement("strong");
                    dayName.textContent = WEEKDAYS[(day.getDay() + 6) % 7];
                    const dayMeta = document.createElement("span");
                    dayMeta.textContent = `${formatShortDate(day)} · ${dayEvents.length}`;
                    dayButton.append(dayName, dayMeta);
                    dayButton.addEventListener("click", () => {
                        document.getElementById(sectionId)?.scrollIntoView({ block: "start", behavior: "smooth" });
                    });
                    strip.append(dayButton);

                    const section = document.createElement("section");
                    section.className = "mobile-day-section";
                    section.id = sectionId;
                    const header = document.createElement("header");
                    header.className = "mobile-day-header";
                    const title = document.createElement("h3");
                    title.textContent = formatLongDate(day);
                    const count = document.createElement("span");
                    count.className = "metric";
                    count.textContent = String(dayEvents.length);
                    header.append(title, count);
                    section.append(header);

                    if (dayEvents.length) {
                        const events = document.createElement("div");
                        events.className = "mobile-day-events";
                        dayEvents.forEach((event) => events.append(createMobileEventCard(event)));
                        section.append(events);
                    } else {
                        const empty = document.createElement("p");
                        empty.className = "mobile-empty-day";
                        empty.textContent = "Keine Termine";
                        section.append(empty);
                    }

                    list.append(section);
                });

                els.mobileCalendar.append(strip, list);
            }

            function createMobileEventCard(event) {
                const card = document.createElement("button");
                card.type = "button";
                card.className = `mobile-event-card${event.hasConflict ? " is-conflict" : ""}`;
                card.addEventListener("click", () => showEventDialog(event));

                const time = document.createElement("span");
                time.className = "mobile-event-time";
                time.textContent = `${event.start} - ${event.end}`;

                const body = document.createElement("span");
                body.className = "mobile-event-body";
                const title = document.createElement("strong");
                title.textContent = event.course;
                const meta = document.createElement("span");
                meta.className = "mobile-event-meta";
                meta.textContent = [event.room || "Raum offen", event.lecturer, event.groups].filter(Boolean).join(" · ");
                body.append(title, meta);

                card.append(time, body);
                return card;
            }

            function renderAgenda(events) {
                els.agendaList.innerHTML = "";
                const grouped = groupBy(events, "dateIso");
                Object.keys(grouped).sort().forEach((dateIso) => {
                    const dayEvents = grouped[dateIso].sort(compareEvents);
                    const conflictIds = getConflictingEventIds(dayEvents);
                    const section = document.createElement("section");
                    section.className = "day-agenda";
                    const header = document.createElement("header");
                    const title = document.createElement("h3");
                    title.textContent = dayEvents[0].dayLabel;
                    const count = document.createElement("span");
                    count.className = "metric";
                    count.textContent = String(dayEvents.length);
                    header.append(title, count);
                    section.append(header);

                    dayEvents.forEach((event) => {
                        const row = document.createElement("button");
                        row.type = "button";
                        row.className = `agenda-event${conflictIds.has(event.id) ? " is-conflict" : ""}`;
                        row.addEventListener("click", () => showEventDialog(event));

                        const time = document.createElement("div");
                        time.className = "agenda-time";
                        time.textContent = `${event.start} - ${event.end}`;

                        const body = document.createElement("div");
                        const titleLine = document.createElement("div");
                        titleLine.className = "agenda-title";
                        titleLine.textContent = event.course;
                        const meta = document.createElement("div");
                        meta.className = "agenda-meta";
                        meta.textContent = [event.type, event.room, event.lecturer, event.groups].filter(Boolean).join(" · ");
                        body.append(titleLine, meta);

                        row.append(time, body);
                        section.append(row);
                    });

                    els.agendaList.append(section);
                });
            }

            function showEventDialog(event) {
                els.dialogTitle.textContent = event.course;
                els.dialogDetails.innerHTML = "";
                [
                    ["Datum", event.dayLabel],
                    ["Uhrzeit", `${event.start} - ${event.end}`],
                    ["Art", event.type],
                    ["Dozent", event.lecturer],
                    ["Raum", event.room],
                    ["Gruppe", event.groups],
                    ["Dauer", event.duration]
                ].forEach(([label, value]) => {
                    const dt = document.createElement("dt");
                    dt.textContent = label;
                    const dd = document.createElement("dd");
                    dd.textContent = value || "-";
                    els.dialogDetails.append(dt, dd);
                });
                if (typeof els.eventDialog.showModal === "function") {
                    els.eventDialog.showModal();
                }
            }

            function layoutDayEvents(events) {
                const sorted = [...events].sort(compareEvents);
                const clusters = [];
                let cluster = null;

                sorted.forEach((event) => {
                    if (!cluster || event.startMinutes >= cluster.end) {
                        cluster = { events: [], end: event.endMinutes };
                        clusters.push(cluster);
                    }
                    cluster.events.push(event);
                    cluster.end = Math.max(cluster.end, event.endMinutes);
                });

                const laidOut = [];
                clusters.forEach((item) => {
                    const columns = [];
                    const conflictIds = getConflictingEventIds(item.events);
                    item.events.forEach((event) => {
                        let columnIndex = columns.findIndex((end) => event.startMinutes >= end);
                        if (columnIndex === -1) {
                            columnIndex = columns.length;
                            columns.push(event.endMinutes);
                        } else {
                            columns[columnIndex] = event.endMinutes;
                        }
                        laidOut.push({
                            ...event,
                            hasConflict: conflictIds.has(event.id),
                            layoutColumn: columnIndex,
                            layoutColumns: columns.length
                        });
                    });

                    laidOut.slice(-item.events.length).forEach((event) => {
                        event.layoutColumns = columns.length;
                    });
                });

                return laidOut;
            }

            function getConflictingEventIds(events) {
                const conflictIds = new Set();
                for (let i = 0; i < events.length; i += 1) {
                    for (let j = i + 1; j < events.length; j += 1) {
                        if (eventsOverlap(events[i], events[j]) && events[i].moduleId !== events[j].moduleId) {
                            conflictIds.add(events[i].id);
                            conflictIds.add(events[j].id);
                        }
                    }
                }
                return conflictIds;
            }

            function getTimeRange(events) {
                const min = Math.min(...events.map((event) => event.startMinutes), 8 * 60);
                const max = Math.max(...events.map((event) => event.endMinutes), 19 * 60);
                return {
                    start: Math.max(0, Math.floor(min / 60) * 60),
                    end: Math.min(24 * 60, Math.ceil(max / 60) * 60)
                };
            }

            function getConflicts(events) {
                const conflicts = [];
                const grouped = groupBy(events, "dateIso");
                Object.values(grouped).forEach((dayEvents) => {
                    const sorted = [...dayEvents].sort(compareEvents);
                    for (let i = 0; i < sorted.length; i += 1) {
                        for (let j = i + 1; j < sorted.length; j += 1) {
                            if (sorted[j].startMinutes >= sorted[i].endMinutes) break;
                            if (sorted[i].moduleId !== sorted[j].moduleId && eventsOverlap(sorted[i], sorted[j])) {
                                conflicts.push(createConflict(sorted[i], sorted[j]));
                            }
                        }
                    }
                });
                return conflicts;
            }

            function createConflict(first, second) {
                const overlapStart = Math.max(first.startMinutes, second.startMinutes);
                const overlapEnd = Math.min(first.endMinutes, second.endMinutes);
                return {
                    id: `${first.id}-${second.id}`,
                    dateIso: first.dateIso,
                    dayLabel: first.dayLabel,
                    time: `${minutesToTime(overlapStart)} - ${minutesToTime(overlapEnd)}`,
                    events: [first, second].sort(compareEvents)
                };
            }

            function eventsOverlap(a, b) {
                return a.startMinutes < b.endMinutes && b.startMinutes < a.endMinutes;
            }

            function getRenderedEvents() {
                if (!state.renderedModules.size) return [];
                return state.events
                    .filter((event) => state.renderedModules.has(event.moduleId))
                    .sort(compareEvents);
            }

            function getFilteredModules(query) {
                if (!query) return state.modules;
                return state.modules.filter((module) => {
                    const haystack = normalizeSearch([
                        getModuleLabel(module),
                        module.name,
                        module.lecturer,
                        module.studyGroup,
                        ...module.groups,
                        ...module.lecturers,
                        ...module.rooms
                    ].join(" "));
                    return haystack.includes(query);
                });
            }

            function updateSelectionSummary() {
                const selected = state.selectedModules.size;
                if (!state.modules.length) {
                    els.selectionSummary.textContent = "Noch keine Daten geladen.";
                } else if (!selected) {
                    els.selectionSummary.textContent = `${state.modules.length} Modulangebote gefunden.`;
                } else {
                    els.selectionSummary.textContent = `${selected} von ${state.modules.length} Angeboten ausgewählt.`;
                }
            }

            function updateBuildButton() {
                const selected = state.selectedModules.size;
                els.buildButton.disabled = selected === 0 || state.events.length === 0;
                els.buildButton.textContent = selected ? `Kalender bauen (${selected})` : "Kalender bauen";
            }

            function setSourceStatus(text, tone) {
                els.sourceStatus.textContent = text;
                els.sourceStatus.dataset.tone = tone;
            }

            function setLoading(isLoading) {
                els.reloadButton.disabled = isLoading;
                els.loadUrlButton.disabled = isLoading;
                els.buildButton.disabled = isLoading || state.selectedModules.size === 0 || state.events.length === 0;
            }

            function renderConflictPanel(conflicts) {
                els.conflictSummary.textContent = `${conflicts.length} zeitliche Überschneidung${conflicts.length === 1 ? "" : "en"} in der aktuellen Auswahl.`;
                els.conflictDetails.innerHTML = "";
                conflicts.forEach((conflict) => {
                    els.conflictDetails.append(createConflictItem(conflict));
                });
                els.conflictPanel.classList.add("is-visible");
                updateConflictToggle();
            }

            function createConflictItem(conflict) {
                const item = document.createElement("div");
                item.className = "conflict-item";

                const title = document.createElement("strong");
                title.textContent = `${conflict.dayLabel} · ${conflict.time}`;

                const details = document.createElement("span");
                details.textContent = conflict.events.map(formatConflictEvent).join(" ↔ ");

                item.append(title, details);
                return item;
            }

            function formatConflictEvent(event) {
                const details = [event.lecturer || "ohne Dozent", event.groups, event.room || "Raum offen"].filter(Boolean).join(", ");
                return `${event.course} (${details})`;
            }

            function hideConflictPanel() {
                state.conflictsExpanded = false;
                els.conflictSummary.textContent = "";
                els.conflictDetails.innerHTML = "";
                els.conflictPanel.classList.remove("is-visible");
                updateConflictToggle();
            }

            function toggleConflictDetails() {
                state.conflictsExpanded = !state.conflictsExpanded;
                updateConflictToggle();
            }

            function updateConflictToggle() {
                const expanded = state.conflictsExpanded && els.conflictPanel.classList.contains("is-visible");
                els.conflictPanel.classList.toggle("is-expanded", expanded);
                els.conflictToggle.setAttribute("aria-expanded", String(expanded));
                els.conflictDetails.setAttribute("aria-hidden", String(!expanded));
                els.conflictToggleLabel.textContent = expanded ? "Details ausblenden" : "Details anzeigen";
            }

            function shiftWeek(offset) {
                if (!state.visibleWeekStart) return;
                state.visibleWeekStart = addDays(state.visibleWeekStart, offset * 7);
                renderCalendar();
            }

            function jumpToToday() {
                state.visibleWeekStart = startOfWeek(new Date());
                renderCalendar();
            }

            function switchView(view) {
                state.activeView = view;
                els.calendarTab.setAttribute("aria-selected", String(view === "calendar"));
                els.listTab.setAttribute("aria-selected", String(view === "list"));
