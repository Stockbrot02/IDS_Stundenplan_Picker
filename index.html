                els.calendarView.classList.toggle("is-active", view === "calendar");
                els.listView.classList.toggle("is-active", view === "list");
            }

            function exportIcs() {
                const events = getRenderedEvents();
                if (!events.length) return;

                const lines = [
                    "BEGIN:VCALENDAR",
                    "VERSION:2.0",
                    "PRODID:-//Stundenplan Picker//HS Osnabrueck//DE",
                    "CALSCALE:GREGORIAN",
                    "METHOD:PUBLISH",
                    "X-WR-CALNAME:Stundenplan Picker"
                ];

                const stamp = toIcsStamp(new Date());
                events.forEach((event, index) => {
                    const description = [
                        event.type ? `Art: ${event.type}` : "",
                        event.lecturer ? `Dozent: ${event.lecturer}` : "",
                        event.groups ? `Studiengruppe: ${event.groups}` : ""
                    ].filter(Boolean).join("\\n");
                    lines.push(
                        "BEGIN:VEVENT",
                        `UID:${escapeIcs(createIcsUid(event, index))}`,
                        `DTSTAMP:${stamp}`,
                        `DTSTART;TZID=Europe/Berlin:${toIcsLocal(event.dateIso, event.start)}`,
                        `DTEND;TZID=Europe/Berlin:${toIcsLocal(event.dateIso, event.end)}`,
                        `SUMMARY:${escapeIcs(event.course)}`,
                        `LOCATION:${escapeIcs(event.room)}`,
                        `DESCRIPTION:${escapeIcs(description)}`,
                        "END:VEVENT"
                    );
                });

                lines.push("END:VCALENDAR");
                const blob = new Blob([lines.map(foldIcsLine).join("\r\n")], { type: "text/calendar;charset=utf-8" });
                const url = URL.createObjectURL(blob);
                const anchor = document.createElement("a");
                anchor.href = url;
                anchor.download = "stundenplan.ics";
                document.body.append(anchor);
                anchor.click();
                anchor.remove();
                URL.revokeObjectURL(url);
            }

            function persistSelection() {
                writeStorage(STORAGE_KEYS.selection, JSON.stringify([...state.selectedModules]));
            }

            function persistRenderedSelection() {
                writeStorage(STORAGE_KEYS.renderedSelection, JSON.stringify([...state.renderedModules]));
            }

            function persistCalendarState() {
                persistSelection();
                persistRenderedSelection();
            }

            function readStoredList(key) {
                try {
                    const value = JSON.parse(readStorage(key, "[]"));
                    return Array.isArray(value)
                        ? value.filter((item) => typeof item === "string" && item.trim())
                        : [];
                } catch {
                    return [];
                }
            }

            function readStorage(key, fallback) {
                try {
                    return localStorage.getItem(key) ?? fallback;
                } catch {
                    return fallback;
                }
            }

            function writeStorage(key, value) {
                try {
                    localStorage.setItem(key, value);
                } catch {
                    // Lokale Speicherung ist nur Komfort.
                }
            }

            function parseGermanDate(text) {
                const match = text.match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);
                if (!match) return null;
                return new Date(Number(match[3]), Number(match[2]) - 1, Number(match[1]));
            }

            function readTime(text) {
                return cleanText(text).match(/\d{1,2}:\d{2}/)?.[0] || "";
            }

            function timeToMinutes(time) {
                const [hours, minutes] = time.split(":").map(Number);
                return hours * 60 + minutes;
            }

            function minutesToTime(minutes) {
                return `${String(Math.floor(minutes / 60)).padStart(2, "0")}:${String(minutes % 60).padStart(2, "0")}`;
            }

            function toIsoDate(date) {
                return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
            }

            function toIcsLocal(dateIso, time) {
                return `${dateIso.replaceAll("-", "")}T${time.replace(":", "")}00`;
            }

            function createIcsUid(event, index) {
                const fingerprint = [
                    index,
                    event.id,
                    event.moduleId,
                    event.dateIso,
                    event.start,
                    event.end,
                    event.course,
                    event.lecturer,
                    event.room,
                    event.groups
                ].map(cleanText).join("|");
                return `${event.dateIso}-${event.start.replace(":", "")}-${hashString(fingerprint)}@stundenplan-picker`;
            }

            function hashString(value) {
                let hash = 0x811c9dc5;
                for (let index = 0; index < value.length; index += 1) {
                    hash ^= value.charCodeAt(index);
                    hash = Math.imul(hash, 0x01000193);
                }
                return (hash >>> 0).toString(36);
            }

            function toIcsStamp(date) {
                return date.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
            }

            function escapeIcs(value) {
                return String(value || "")
                    .replaceAll("\\", "\\\\")
                    .replaceAll(";", "\\;")
                    .replaceAll(",", "\\,")
                    .replace(/\r?\n/g, "\\n");
            }

            function foldIcsLine(line) {
                const encoder = new TextEncoder();
                const chunks = [];
                let current = "";

                for (const char of String(line)) {
                    if (current && encoder.encode(current + char).length > 73) {
                        chunks.push(current);
                        current = ` ${char}`;
                    } else {
                        current += char;
                    }
                }

                chunks.push(current);
                return chunks.join("\r\n");
            }

            function startOfWeek(date) {
                const copy = new Date(date.getFullYear(), date.getMonth(), date.getDate());
                const day = (copy.getDay() + 6) % 7;
                copy.setDate(copy.getDate() - day);
                return copy;
            }

            function addDays(date, days) {
                const copy = new Date(date.getFullYear(), date.getMonth(), date.getDate());
                copy.setDate(copy.getDate() + days);
                return copy;
            }

            function chooseInitialWeek(events) {
                if (!events.length) return null;
                const todayIso = toIsoDate(new Date());
                const upcoming = events.find((event) => event.dateIso >= todayIso) || events[0];
                return startOfWeek(upcoming.date);
            }

            function formatShortDate(date) {
                return `${String(date.getDate()).padStart(2, "0")}. ${MONTHS[date.getMonth()]}`;
            }

            function formatLongDate(date) {
                const weekday = WEEKDAYS[(date.getDay() + 6) % 7];
                return `${weekday}, ${String(date.getDate()).padStart(2, "0")}.${String(date.getMonth() + 1).padStart(2, "0")}.${date.getFullYear()}`;
            }

            function compareEvents(a, b) {
                return a.dateIso.localeCompare(b.dateIso) || a.startMinutes - b.startMinutes || a.course.localeCompare(b.course, "de");
            }

            function splitList(value) {
                return cleanText(value).split(",").map((item) => item.trim()).filter(Boolean);
            }

            function formatTermCount(count) {
                return `${count} ${count === 1 ? "Termin" : "Termine"}`;
            }

            function groupBy(items, key) {
                return items.reduce((groups, item) => {
                    const value = item[key];
                    if (!groups[value]) groups[value] = [];
                    groups[value].push(item);
                    return groups;
                }, {});
            }

            function cleanText(value) {
                return String(value || "").replace(/\u00a0/g, " ").replace(/\s+/g, " ").trim();
            }

            function normalizeSearch(value) {
                return cleanText(value).toLocaleLowerCase("de-DE");
            }
        })();
    </script>
</body>
</html>
